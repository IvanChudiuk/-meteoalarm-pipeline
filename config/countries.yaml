# Countries configuration for MeteoAlarm pipeline
# 
# Each country can be enabled/disabled and filtered by severity, certainty, and urgency.
# Leave filters empty to track all values.
#
# Global defaults (optional):
# If use_defaults is true, apply default filters to all enabled countries.
# Individual country filters can still override these if needed.

defaults:
  use_defaults: True  # Set to true to apply defaults to all countries
  severities: [orange, red]
  certainties: [observed, likely, possible]
  urgencies: [immediate, expected, future]

countries:
  spain:
    enabled: true
    name: Spain
    feed_url: https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-spain
    severities: [green, yellow, orange, red]
    certainties: [observed, likely, possible]
    urgencies: [immediate, expected, future]

